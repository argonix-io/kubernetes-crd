name: Helm Release

on:
  push:
    branches:
      - main
    paths:
      - 'chart/Chart.yaml'

concurrency:
  group: publish-operator-chart
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app-version: ${{ steps.versions.outputs.app-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate chart and image versions
        id: versions
        run: |
          set -euo pipefail
          chart_version="$(awk '/^version:/ {print $2}' chart/Chart.yaml)"
          app_version="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' chart/Chart.yaml)"
          [[ "$chart_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "$app_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          if git show-ref --verify --quiet "refs/tags/v$chart_version"; then
            echo "Chart tag v$chart_version already exists." >&2
            exit 1
          fi
          echo "app-version=$app_version" >> "$GITHUB_OUTPUT"

  image:
    needs: validate
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      packages: write
    with:
      release-version: ${{ needs.validate.outputs.app-version }}

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kubernetes-crd
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          helm dependency update chart
          helm package chart --destination /tmp/helm-packages

      - name: Checkout charts repo
        uses: actions/checkout@v4
        with:
          repository: argonix-io/charts
          token: ${{ secrets.CHARTS_REPO_TOKEN }}
          path: charts-repo

      - name: Update index and push
        run: |
          cp /tmp/helm-packages/*.tgz charts-repo/
          helm repo index charts-repo --url https://charts.argonix.io --merge charts-repo/index.yaml
          cd charts-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "release: $(ls /tmp/helm-packages/*.tgz | xargs basename)"
          git push

      - name: Create git tag
        run: |
          VERSION="v$(grep '^version:' chart/Chart.yaml | awk '{print $2}')"
          git tag "$VERSION"
          git push origin "$VERSION"
