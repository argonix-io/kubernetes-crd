                type: string
              dateCreated:
                description: DateCreated is the creation timestamp.
                type: string
              dateModified:
                description: DateModified is the last modification timestamp.
                type: string
              heartbeatToken:
                description: HeartbeatToken is the auto-generated heartbeat token.
                type: string
              id:
