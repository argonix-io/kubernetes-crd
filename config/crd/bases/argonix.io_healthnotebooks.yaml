    listKind: HealthNotebookList
    plural: healthnotebooks
    singular: healthnotebook
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.frequency
      name: Frequency
      type: string
    - jsonPath: .spec.isActive
      name: Active
      type: boolean
    - jsonPath: .status.latestScore
      name: Score
      type: integer
    - jsonPath: .status.latestSeverity
      name: Severity
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HealthNotebook is the Schema for the healthnotebooks API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HealthNotebookSpec defines the desired state of a HealthNotebook —
              a scheduled AI-generated infrastructure health report ("carnet de santé").
            properties:
              alertChannelIds:
                description: AlertChannelIDs is a JSON-encoded list of alert channel
                  UUIDs.
                type: string
              connectorIds:
                description: |-
                  ConnectorIDs is a JSON-encoded list of connector UUIDs to scope the report.
                  Empty means all organization connectors.
                type: string
              customPrompt:
                description: CustomPrompt overrides the default health-check prompt.
                type: string
              frequency:
                default: daily
                description: Frequency is how often the notebook runs.
                enum:
                - daily
                - weekly
                - monthly
                type: string
              includeCost:
                default: true
                description: IncludeCost includes FinOps cost anomalies in the report.
                type: boolean
              includeFindings:
                default: true
                description: IncludeFindings includes security findings in the report.
                type: boolean
              includeIncidents:
                default: true
                description: IncludeIncidents includes incidents in the report.
                type: boolean
              includeMonitors:
                default: true
                description: IncludeMonitors includes monitor/uptime status in the
                  report.
                type: boolean
              includeThreats:
                default: true
                description: IncludeThreats includes threat detections in the report.
                type: boolean
              isActive:
                default: true
                description: IsActive indicates whether the notebook runs on its schedule.
                type: boolean
              name:
                description: Name is the display name of the health notebook.
                type: string
              notificationChannelIds:
                description: NotificationChannelIDs is a JSON-encoded list of chat
                  channel UUIDs.
                type: string
              scheduleDayOfMonth:
                description: ScheduleDayOfMonth is the day of month (1-31) for the
                  monthly frequency.
                type: integer
              scheduleDays:
                description: ScheduleDays is a JSON-encoded list of weekday indexes
                  (weekly frequency).
                type: string
              scheduleHour:
                description: ScheduleHour is the hour of day (0-23) the notebook runs.
                maximum: 23
                minimum: 0
                type: integer
              scheduleMinute:
                description: ScheduleMinute is the minute of the hour (0-59) the notebook
                  runs.
                maximum: 59
                minimum: 0
                type: integer
              ticketingAction:
                default: none
                description: TicketingAction is what to do when a ticket-worthy finding
                  recurs.
                enum:
                - none
                - investigate
                - remediate
                type: string
              ticketingMinSeverity:
                description: |-
                  TicketingMinSeverity is the minimum severity that opens a ticket
                  (info, warning, error, critical). Empty disables ticketing.
                enum:
                - ""
                - info
                - warning
                - error
                - critical
                type: string
            required:
            - name
            type: object
          status:
            description: HealthNotebookStatus defines the observed state of a HealthNotebook.
            properties:
              conditions:
