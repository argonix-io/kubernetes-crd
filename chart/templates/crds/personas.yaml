apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: personas.argonix.io
  labels:
    {{- include "argonix-crd.labels" . | nindent 4 }}
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
spec:
  group: argonix.io
  names:
    kind: Persona
    listKind: PersonaList
    plural: personas
    singular: persona
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Template
          type: string
          jsonPath: .spec.template
        - name: Active
          type: boolean
          jsonPath: .spec.isActive
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: Persona is the Schema for the personas API.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: PersonaSpec defines the desired state of a Persona.
              required:
                - name
              properties:
                name:
                  type: string
                  description: Display name of the persona.
                description:
                  type: string
                template:
                  type: string
                  default: "custom"
                  enum: [devops, it_support, hr, security, custom]
                systemPrompt:
                  type: string
                isActive:
                  type: boolean
                  default: true
                connectorIds:
                  type: string
                allowedTools:
                  type: string
                approvalRules:
                  type: string
            status:
              type: object
              description: PersonaStatus defines the observed state of a Persona.
              properties:
                id:
                  type: string
                dateCreated:
                  type: string
                dateModified:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
