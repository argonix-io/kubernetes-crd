apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflows.argonix.io
  labels:
    {{- include "argonix-crd.labels" . | nindent 4 }}
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
spec:
  group: argonix.io
  names:
    kind: Workflow
    listKind: WorkflowList
    plural: workflows
    singular: workflow
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Category
          type: string
          jsonPath: .spec.category
        - name: Active
          type: boolean
          jsonPath: .spec.isActive
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: Workflow is the Schema for the workflows API.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: WorkflowSpec defines the desired state of a Workflow.
              required:
                - name
              properties:
                name:
                  type: string
                  description: Display name of the workflow.
                slug:
                  type: string
                description:
                  type: string
                category:
                  type: string
                  default: "general"
                  enum: [identity, incident, onboarding, devops, security, general]
                steps:
                  type: string
                requiredConnectorTypes:
                  type: string
                requiresConfirmation:
                  type: boolean
                  default: true
                schedule:
                  type: string
                isActive:
                  type: boolean
                  default: true
            status:
              type: object
              description: WorkflowStatus defines the observed state of a Workflow.
              properties:
                id:
                  type: string
                dateCreated:
                  type: string
                dateModified:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
