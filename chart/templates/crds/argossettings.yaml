apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: argossettings.argonix.io
  labels:
    {{- include "argonix-crd.labels" . | nindent 4 }}
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
spec:
  group: argonix.io
  names:
    kind: ArgosSettings
    listKind: ArgosSettingsList
    plural: argossettings
    singular: argossettings
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.llmProvider
        - name: Model
          type: string
          jsonPath: .spec.llmModel
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: ArgosSettings is the Schema for the argossettings API.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: ArgosSettingsSpec defines the desired state of ArgosSettings.
              required:
                - llmProvider
              properties:
                llmProvider:
                  type: string
                  default: "google"
                  enum: [local, google, anthropic, openai]
                  description: AI model provider.
                llmModel:
                  type: string
                  description: Model override (blank = default for the provider).
                llmApiKeySecretRef:
                  type: object
                  description: Reference to a Kubernetes Secret containing the custom API key.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: "api-key"
                llmBaseURL:
                  type: string
                  description: Custom base URL for the LLM endpoint.
                customInstructions:
                  type: string
                demoMode:
                  type: boolean
                  default: false
            status:
              type: object
              description: ArgosSettingsStatus defines the observed state of ArgosSettings.
              properties:
                id:
                  type: string
                dateModified:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
