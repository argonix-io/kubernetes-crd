apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "argonix-crd.labels" . | nindent 4 }}
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: srepatrols.argonix.io
spec:
  group: argonix.io
  names:
    kind: SREPatrol
    listKind: SREPatrolList
    plural: srepatrols
    singular: srepatrol
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.lastRunStatus
      name: Last run
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SREPatrol is the schema for the srepatrols API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SREPatrolSpec defines the desired state of a SREPatrol.
            properties:
              alertChannelIds:
                description: AlertChannelIDs lists ticketing channel UUIDs.
                items:
                  type: string
                type: array
              allowMrAuthoring:
                description: AllowMRAuthoring allows drafting merge requests for review.
                type: boolean
              allowedWorkflowIds:
                description: AllowedWorkflowIDs lists explicitly approved workflows.
                items:
                  type: string
                type: array
              applicationRootIds:
                description: ApplicationRootIDs lists scoped application UUIDs.
                items:
                  type: string
                type: array
              autonomy:
                description: Autonomy sets the approved response mode for operational
                  signals.
                enum:
                - observe
                - propose
                - act
                type: string
              cadenceMinutes:
                description: CadenceMinutes is the number of minutes between sweeps.
                maximum: 60
                minimum: 5
                type: integer
              connectorIds:
                description: ConnectorIDs lists scoped connector UUIDs.
                items:
                  type: string
                type: array
              customPrompt:
                description: CustomPrompt provides standing instructions for the patrol
                  report.
                type: string
              deliveryChannelIds:
                description: DeliveryChannelIDs lists result delivery channel UUIDs.
                items:
                  type: string
                type: array
              includeUnattributed:
                description: IncludeUnattributed includes signals without attribution.
                type: boolean
              isActive:
                description: IsActive enables scheduled sweeps.
                type: boolean
              minConfidence:
                description: MinConfidence sets the reporting confidence threshold.
                maximum: 100
                minimum: 0
                type: integer
              minimumAttributionConfidence:
                description: MinimumAttributionConfidence sets the minimum attribution
                  confidence.
                maximum: 100
                minimum: 0
                type: integer
              name:
                description: Name is the display name of the patrol.
                maxLength: 255
                minLength: 1
                type: string
              notificationChannelIds:
                description: NotificationChannelIDs lists Argos chat channel UUIDs.
                items:
                  type: string
                type: array
              perspective:
                description: Perspective selects the application perspective.
                enum:
                - all
                - business
                - platform
                type: string
              ticketingMinSeverity:
                description: TicketingMinSeverity is the minimum severity for creating
                  a ticket.
                type: string
              useApplications:
                description: UseApplications enables application scoping.
                type: boolean
              workflowBindings:
                description: WorkflowBindings lists the trigger rules and input mappings
                  for approved workflows.
                items:
                  additionalProperties:
                    x-kubernetes-preserve-unknown-fields: true
                  type: object
                type: array
            required:
            - name
            type: object
          status:
            description: SREPatrolStatus contains the observed Argonix state.
            properties:
              conditions:
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dateCreated:
                type: string
              dateModified:
                type: string
              id:
                type: string
              lastRunDate:
                description: LastRunDate is when the most recent run was created.
                type: string
              lastRunStatus:
                description: LastRunStatus is the most recent run status.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
