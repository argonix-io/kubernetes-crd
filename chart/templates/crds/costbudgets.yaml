                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dateCreated:
                description: DateCreated is the creation timestamp.
                type: string
              dateUpdated:
                description: DateUpdated is the last modification timestamp.
                type: string
              id:
                description: ID is the UUID of the budget in the Argonix API.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
